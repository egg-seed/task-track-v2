name: Sample quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Lets deploy-phase01.yml run exactly these checks before it deploys.
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        phase:
          - phase-01-basic
          - phase-02-router
          - phase-03-sqlmodel
          - phase-04-alembic
          - phase-04-async
    defaults:
      run:
        working-directory: ${{ matrix.phase }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy app tests
      - name: Tests and coverage
        run: |
          uv run --locked --with "pytest-cov==7.1.0" pytest -q \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report="markdown-append:$GITHUB_STEP_SUMMARY" \
            --cov-fail-under=80
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.phase }}
          path: ${{ matrix.phase }}/coverage.xml
          if-no-files-found: warn

  phase04-postgresql:
    name: Phase 04 on PostgreSQL (${{ matrix.phase }})
    strategy:
      fail-fast: false
      matrix:
        phase: [phase-04-alembic, phase-04-async]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: tasks-ci-only
          POSTGRES_DB: tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ${{ matrix.phase }}
    env:
      TASKS_TEST_POSTGRES_URL: postgresql://tasks:tasks-ci-only@localhost:5432/tasks_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: PostgreSQL tests
        run: uv run pytest -q tests/integration/test_postgresql.py

  cognito-auth:
    name: Cognito JWT offline authentication tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cognito-auth
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Offline JWT checks and coverage
        run: |
          uv run --locked --with "pytest-cov==7.1.0" pytest -q \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report="markdown-append:$GITHUB_STEP_SUMMARY" \
            --cov-fail-under=80

  auth-basics:
    name: Auth basics (API key / OAuth2 password) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-basics
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests and coverage
        run: |
          uv run --locked --with "pytest-cov==7.1.0" pytest -q \
            --cov=api_key_app --cov=oauth2_app --cov=tasks \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report="markdown-append:$GITHUB_STEP_SUMMARY" \
            --cov-fail-under=80

  async-demo:
    name: Asyncio demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Verify async demo
        run: python sync-async-demo.py

  phase01-container:
    name: Phase 01 Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build learning image
        run: docker build -t fastapi-v2-phase01 phase-01-basic
      - name: Start container
        run: |
          docker run -d --name phase01-api -p 127.0.0.1:8000:8000 fastapi-v2-phase01
      - name: Verify health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs phase01-api
          exit 1
      - name: Clean up
        if: always()
        run: docker rm --force phase01-api || true

  phase04-container:
    name: Phase 04 production image with Compose (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase-04-alembic
    steps:
      - uses: actions/checkout@v7
      - name: Build and start db, migrate, and api
        run: docker compose up --build --detach --wait api
      - name: Migration job finished successfully
        run: test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"
      - name: Readiness and API round trip
        run: |
          curl --fail --silent http://127.0.0.1:8000/health/ready | grep -q '"database":"ok"'
          curl --fail --silent -X POST http://127.0.0.1:8000/tasks \
            -H 'content-type: application/json' -d '{"title":"from CI"}'
          curl --fail --silent http://127.0.0.1:8000/tasks | grep -q 'from CI'
      - name: Runs as a non-root user
        run: test "$(docker compose exec api id -u)" = "10001"
      - name: Stops gracefully on SIGTERM
        run: |
          docker compose stop api
          test "$(docker compose ps -a api --format '{{.ExitCode}}')" = "0"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down --volumes
