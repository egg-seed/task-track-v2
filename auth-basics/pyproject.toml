[project]
name = "fastapi-v2-auth-basics"
version = "0.1.0"
description = "FastAPI 第2版: APIキーとOAuth2パスワードフローによる認証・認可の独立サンプル（第17章）"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.163,<0.164",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["api_key_app", "oauth2_app", "tasks", "conftest"]

[tool.mypy]
python_version = "3.14"
files = ["*.py"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
show_error_codes = true
