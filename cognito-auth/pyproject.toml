[project]
name = "fastapi-v2-cognito-auth"
version = "0.1.0"
description = "FastAPI 第2版: Cognito JWT認証の独立サンプル"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.143,<0.144",
    "PyJWT[crypto]>=2.10,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=9,<10",
    "ruff>=0.17,<0.18",
    "mypy>=1.18,<2",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.14"
files = ["app.py", "test_app.py"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
show_error_codes = true
