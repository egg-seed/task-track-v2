[project]
name = "fastapi-v2-phase04"
version = "0.1.0"
description = "FastAPI技術書 第2版 Phase 04: Alembic migrations"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.143,<0.144",
    "sqlmodel>=0.0.48,<0.1",
    "alembic>=1.19,<2",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "httpx>=0.28,<0.29",
    "ruff>=0.17,<0.18",
    "mypy>=1.18,<2",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.14"
files = ["app", "tests"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
show_error_codes = true
